name: Docker

on:  # zizmor: ignore[dangerous-triggers] workflow_run is required (runs after Release) and is guarded by the head-repository check on every privileged job below
  # Runs after the Release workflow completes successfully on a tag push.
  # Release workflow publishes the signed SEA binaries first; this one then
  # pulls those binaries inside the Dockerfile's verify stage.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.4.8). Must match an existing GitHub Release."
        required: true
        type: string
      dry_run:
        description: "Build multi-arch without pushing to registry"
        type: boolean
        default: true

# Workflow-level is read-only; the publishing jobs elevate what they need.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/dotcoocoo/hermitstash-sync
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Resolve the immutable release tag ONCE, in a run step, and hand it to
  # every job below as a job output. No checkout in this pipeline ever binds
  # its `ref:` to github.event.workflow_run.head_* — the triggering run's head
  # is consumed only here, validated, and never executed. That both removes
  # the untrusted-ref pattern from every checkout and makes the build provably
  # use the released tag commit rather than a moving branch tip.
  resolve-tag:
    # Trust guard: only proceed for a successful Release run that originated
    # from THIS repository. A fork-originated run can never reach the
    # privileged jobs below because they all `needs: resolve-tag`, and a
    # skipped guarded job skips its dependents. workflow_dispatch resolves
    # the tag from its version input instead.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve released tag
        id: resolve
        env:
          # A Release run is fired by a tag push, so its head_branch is the
          # tag short name (vX.Y.Z). Passed through env and never interpolated
          # into the script body, so a hostile value cannot inject shell.
          WR_TAG: ${{ github.event.workflow_run.head_branch }}
          INPUT_VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            TAG="v${INPUT_VERSION#v}"
          else
            TAG="${WR_TAG:-}"
          fi
          # Hard-validate shape: only an immutable vX.Y.Z release tag is built.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::resolved tag '${TAG}' is not a vX.Y.Z release tag"; exit 1
          fi
          # Confirm the tag exists upstream and resolve the commit it points to
          # (annotated/signed tags need ^{} to peel to the commit; a lightweight
          # tag has no peel, so fall back to the ref SHA).
          REMOTE="https://github.com/${REPO}.git"
          SHA=$(git ls-remote "$REMOTE" "refs/tags/${TAG}^{}" | awk '{print $1}')
          if [ -z "$SHA" ]; then
            SHA=$(git ls-remote "$REMOTE" "refs/tags/${TAG}" | awk '{print $1}')
          fi
          if [ -z "$SHA" ]; then
            echo "::error::tag ${TAG} not found in ${REPO}"; exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${TAG} -> ${SHA}"

  # Lint must pass before a release image is published. Mirrors ci.yml's
  # lint job (same rules, same pins) so a red ci.yml always implies a red
  # docker-publish. No PR comment here — tag pushes aren't PR events.
  lint:
    needs: resolve-tag
    # Belt-and-suspenders: resolve-tag already enforced the trusted-origin
    # guard (and gates this job by being a `needs` dependency), but keep the
    # explicit guard so the job's trust precondition is readable in place.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '>=24.16.0'

      - name: Install ESLint
        run: npm install --no-save eslint@^10 eslint-plugin-security@^4

      - name: Run ESLint
        id: eslint
        run: |
          set +e
          cat > eslint.ci.config.js << 'ESLINT_CONFIG'
          var security = require("eslint-plugin-security");
          module.exports = [
            { ignores: ["tests/", "node_modules/**", "vendor/**", "build/**", "eslint.ci.config.js"] },
            {
              files: ["**/*.js"],
              plugins: { security: security },
              linterOptions: { reportUnusedDisableDirectives: "off" },
              languageOptions: {
                ecmaVersion: 2022, sourceType: "commonjs",
                globals: {
                  require: "readonly", module: "readonly", exports: "readonly",
                  __dirname: "readonly", __filename: "readonly",
                  process: "readonly", console: "readonly", Buffer: "readonly",
                  setTimeout: "readonly", setInterval: "readonly", setImmediate: "readonly",
                  clearTimeout: "readonly", clearInterval: "readonly",
                  URL: "readonly", URLSearchParams: "readonly",
                  global: "readonly", crypto: "readonly",
                  TextEncoder: "readonly", TextDecoder: "readonly",
                  Atomics: "readonly", SharedArrayBuffer: "readonly", Int32Array: "readonly",
                },
              },
              rules: {
                "no-unused-vars": ["warn", { argsIgnorePattern: "^_", caughtErrorsIgnorePattern: "^_" }],
                "no-console": "off",
                "no-eval": "error", "no-implied-eval": "error", "no-new-func": "error",
                "no-self-compare": "error", "no-constructor-return": "error",
                "no-new-wrappers": "error", "no-throw-literal": "error",
                "security/detect-eval-with-expression": "error",
                "security/detect-child-process": "warn",
                "security/detect-unsafe-regex": "error",
                "security/detect-buffer-noassert": "error",
                "security/detect-new-buffer": "error",
                "security/detect-possible-timing-attacks": "warn",
                "security/detect-pseudoRandomBytes": "warn",
                "security/detect-object-injection": "off",
                "security/detect-non-literal-fs-filename": "off",
                "security/detect-non-literal-require": "off",
                "security/detect-non-literal-regexp": "off",
              },
            },
          ];
          ESLINT_CONFIG
          ESLINT_OUTPUT=$(npx eslint --config eslint.ci.config.js . 2>&1)
          ESLINT_CODE=$?
          set -e
          printf '%s\n' "${ESLINT_OUTPUT}"
          echo "exit_code=${ESLINT_CODE}" >> "$GITHUB_OUTPUT"
          exit ${ESLINT_CODE}

      - name: Run Hadolint
        if: always()
        id: hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Run ShellCheck
        if: always()
        id: shellcheck
        run: |
          set +e
          SCRIPTS=$(find . -name '*.sh' -not -path './node_modules/*' -not -path './tests/*' -not -path './build/*' | sort)
          echo "Checking: $SCRIPTS"
          echo "$SCRIPTS" | xargs shellcheck --severity=warning --format=gcc
          CODE=$?
          set -e
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          exit ${CODE}

      - name: Lint summary
        if: always()
        env:
          ESLINT_OUTCOME: ${{ steps.eslint.outcome }}
          HADOLINT_OUTCOME: ${{ steps.hadolint.outcome }}
          SHELLCHECK_OUTCOME: ${{ steps.shellcheck.outcome }}
        run: |
          pass='✅'; fail='❌'
          eslint_icon=$( [ "$ESLINT_OUTCOME" = "success" ] && echo "$pass" || echo "$fail" )
          hadolint_icon=$( [ "$HADOLINT_OUTCOME" = "success" ] && echo "$pass" || echo "$fail" )
          shellcheck_icon=$( [ "$SHELLCHECK_OUTCOME" = "success" ] && echo "$pass" || echo "$fail" )
          {
            echo "### Lint Results"
            echo ""
            echo "Gating docker-publish on the same rules as ci.yml."
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| ESLint (JS + security) | ${eslint_icon} |"
            echo "| Hadolint (Dockerfile)  | ${hadolint_icon} |"
            echo "| ShellCheck (shell)     | ${shellcheck_icon} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    needs: [lint, resolve-tag]
    # Only build + publish from a run triggered by this repository (see lint).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write    # push the multi-arch image to GHCR
      id-token: write    # cosign keyless signing via GitHub OIDC
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Set up Node.js
        # zizmor: ignore[cache-poisoning] no cache input set (zero npm deps).
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '>=24.16.0'

      - name: Verify license is AGPL-3.0
        shell: bash
        run: |
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE || { echo "::error::LICENSE does not contain AGPL-3.0"; exit 1; }
          grep -q '"AGPL-3.0-or-later"' package.json || { echo "::error::package.json license is not AGPL-3.0-or-later"; exit 1; }
          echo "License check passed"

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(node -e "console.log(require('./lib/constants').VERSION)")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building image for v${VERSION}"

      - name: Set up QEMU (for ARM64 cross-build)
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest
          # Pin the revision label to the released tag commit. Left to its
          # default the action stamps github.sha, which for a workflow_run is
          # the default-branch tip — not the commit this image was built from.
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve-tag.outputs.sha }}

      - name: Install cosign
        if: ${{ !inputs.dry_run }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT_SHA=${{ needs.resolve-tag.outputs.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign image with cosign (keyless, GitHub OIDC)
        if: ${{ !inputs.dry_run && steps.build.outputs.digest }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"

      # Visibility scan — every severity, include unfixed upstream CVEs.
      # Never blocks: its job is to let us see the full surface area each
      # release so we notice new CVE classes before a fix exists. The gate
      # below is what actually fails the build.
      - name: Trivy — full visibility scan (all severities, incl. unfixed)
        if: ${{ !inputs.dry_run && steps.build.outputs.digest }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          ignore-unfixed: false

      # Release gate — blocks on actionable findings only: CRITICAL or HIGH
      # severity WITH an available fix (ignore-unfixed filters out upstream
      # CVEs that don't have a patched version yet). Separate run so the
      # visibility scan above isn't contaminated by this filter.
      - name: Trivy — release gate (CRITICAL+HIGH, fixable only)
        if: ${{ !inputs.dry_run && steps.build.outputs.digest }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate SHA3-512 digest of image
        if: ${{ !inputs.dry_run && steps.build.outputs.digest }}
        id: sha3
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${{ env.IMAGE }}@${BUILD_DIGEST}"
          HASH=$(docker save "${{ env.IMAGE }}@${BUILD_DIGEST}" | openssl dgst -sha3-512 | awk '{print $NF}')
          echo "sha3=${HASH}" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "#### SHA3-512 of the published image"
            echo '```'
            echo "${HASH}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build summary
        if: always()
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_DIGEST_OR_NA: ${{ steps.build.outputs.digest || 'n/a' }}
        run: |
          {
            echo "### Docker publish"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Image | \`${{ env.IMAGE }}\` |"
            echo "| Version | v${BUILD_VERSION} |"
            echo "| Tags | \`${META_TAGS}\` |"
            echo "| Digest | \`${BUILD_DIGEST_OR_NA}\` |"
            echo "| Pushed | ${{ !inputs.dry_run && '✅' || '⏭️ dry run' }} |"
            echo "| Signed | ${{ !inputs.dry_run && steps.build.outputs.digest && '✅ cosign keyless' || '⏭️' }} |"
            echo "| Trivy  | ${{ !inputs.dry_run && steps.build.outputs.digest && '✅ full scan + gated on CRITICAL/HIGH fixable' || '⏭️' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Pull the JUST-PUBLISHED image by digest and run the shared packaging
  # smoke checks against it. Proves the signed/attested artifact on GHCR
  # actually boots end-to-end, not just the intermediate local build.
  smoke-test:
    needs: [build-and-push, resolve-tag]
    # Trusted-origin guard (see lint) AND the existing dry-run / digest gates.
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) && !inputs.dry_run && needs.build-and-push.outputs.digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read     # pull the just-published image by digest

    steps:
      - name: Checkout (for scripts/docker-smoke.sh)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-tag.outputs.tag }}

      - name: Log in to GHCR (image may be private until first public pull)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image by digest
        env:
          BUILD_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: docker pull "${{ env.IMAGE }}@${BUILD_DIGEST}"

      - name: Run packaging smoke checks
        env:
          BUILD_DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: bash scripts/docker-smoke.sh "${{ env.IMAGE }}@${BUILD_DIGEST}"

      - name: Verify reported version matches the tag
        shell: bash
        env:
          BUILD_DIGEST: ${{ needs.build-and-push.outputs.digest }}
          BUILD_VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          set -euo pipefail
          OUT=$(docker run --rm --entrypoint /usr/local/bin/hermitstash-sync \
            "${{ env.IMAGE }}@${BUILD_DIGEST}" version)
          echo "$OUT"
          EXPECT="hermitstash-sync v${BUILD_VERSION}"
          echo "$OUT" | grep -qF "$EXPECT" || { echo "::error::image reports wrong version"; exit 1; }

      - name: Smoke-test summary
        if: always()
        env:
          BUILD_DIGEST: ${{ needs.build-and-push.outputs.digest }}
          BUILD_VERSION: ${{ needs.build-and-push.outputs.version }}
        run: |
          {
            echo "### Published-image smoke test"
            echo ""
            echo "Image: \`${{ env.IMAGE }}@${BUILD_DIGEST}\`"
            echo ""
            echo "- Pulled by digest (immutable ref)"
            echo "- Packaging checks via scripts/docker-smoke.sh"
            echo "- Version matches tag v${BUILD_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
