name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build all platforms without creating a release'
        type: boolean
        default: true

# Workflow-level is read-only; downstream jobs elevate as needed
# (contents:write for gh release create, id-token:write for cosign
# keyless + the SLSA reusable workflow's OIDC token).
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            ext: .exe
          - os: ubuntu-latest
            platform: linux
            arch: x64
            ext: ''
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            ext: ''
          - os: macos-latest
            platform: macos
            arch: arm64
            ext: ''
          # macos-13 (Intel) disabled — runner queue times exceed 60 min.
          # Intel Mac users can run the ARM64 binary via Rosetta 2.

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify license is AGPL-3.0
        shell: bash
        run: |
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE || { echo "::error::LICENSE file does not contain AGPL-3.0"; exit 1; }
          grep -q '"AGPL-3.0-or-later"' package.json || { echo "::error::package.json license is not AGPL-3.0-or-later"; exit 1; }
          echo "License check passed"

      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning] no cache input is set, so setup-node
        # caches nothing here; the released artifacts are signature-verified
        # end to end downstream.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # EXACT pin, never a range. This Node builds the SEA binary, and which
          # shared libraries that binary dynamically links is a property of the
          # Node build — the runtime image's `apk add` list in Dockerfile has to
          # match it. A range lets the runner resolve to whatever Node is newest,
          # which silently moved the build from 24 to 26 between two releases and
          # shipped an image that could not start (missing libatomic.so.1). Keep
          # this equal to package.json engines.node, and keep it on an Active LTS
          # line — 25 and 26 are Current, not LTS.
          node-version: '24.19.0'

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./lib/constants').VERSION)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "exe_name=hermitstash-sync-v${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}" >> "$GITHUB_OUTPUT"

      - name: Tag/version match gate
        # Tag push must match `lib/constants.js#VERSION`. The build
        # step embeds VERSION in the SEA; a mismatched tag would ship
        # a binary that reports a different version than the tag it
        # was downloaded from. Skip on dry-run / branch push.
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="${VERSION_OUTPUT}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::lib/constants.js VERSION ($PKG_VERSION) does not match pushed tag (v$TAG_VERSION)"
            exit 1
          fi
          echo "VERSION $PKG_VERSION matches pushed tag v$TAG_VERSION"

      - name: Build SEA binary
        run: node build/build-sea.js

      - name: Verify binary
        shell: bash
        env:
          EXE_NAME: ${{ steps.version.outputs.exe_name }}
        run: |
          EXE="build/${EXE_NAME}"
          "${EXE}" version

      # ---- Security scans ----

      - name: Windows Defender scan
        if: runner.os == 'Windows'
        shell: cmd # zizmor: ignore[misfeature] shell: cmd is required — MpCmdRun.exe is invoked with native Windows paths on the windows-latest matrix leg (default pwsh)
        env:
          EXE_NAME: ${{ steps.version.outputs.exe_name }}
        run: |
          echo Updating virus definitions...
          "C:\Program Files\Windows Defender\MpCmdRun.exe" -SignatureUpdate
          echo Running full scan...
          "C:\Program Files\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "%CD%\build\%EXE_NAME%" -DisableRemediation

      # ---- GPG signing ----

      - name: Import GPG key
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASS: ${{ secrets.GPG_PASSPHRASE }}
        if: env.GPG_KEY != ''
        shell: bash
        run: |
          echo "${GPG_KEY}" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format long 2>/dev/null | grep -E "^sec" | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=${GPG_KEY_ID}" >> "$GITHUB_ENV"

      - name: GPG sign artifacts
        if: env.GPG_KEY_ID != ''
        env:
          GPG_PASS: ${{ secrets.GPG_PASSPHRASE }}
          EXE_NAME: ${{ steps.version.outputs.exe_name }}
        shell: bash
        run: |
          EXE="build/${EXE_NAME}"
          gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASS}" --default-key "${GPG_KEY_ID}" --armor --detach-sign "${EXE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASS}" --default-key "${GPG_KEY_ID}" --armor --detach-sign "${EXE}.sha256"
          gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASS}" --default-key "${GPG_KEY_ID}" --armor --detach-sign "${EXE}.sha3-512"

      # ---- Auto-update signing (ECDSA P-384 over binary, SHA3-512, DER) ----
      # Separate from GPG — this is the key embedded in lib/autoupdate-pubkey.js
      # that the daemon verifies against via b.selfUpdate.verify when self-
      # updating. The verify path uses only Node built-ins (node:crypto).
      #
      # Signature shape: ECDSA P-384, **SHA3-512** hash, DER encoding —
      # matches what `b.selfUpdate.standaloneVerifier` (and the in-binary
      # b.selfUpdate.verify wired in v0.7.7+) checks against.

      - name: ECDSA sign binary for auto-update
        env:
          SIGNING_KEY: ${{ secrets.AUTOUPDATE_SIGNING_KEY }}
          EXE_NAME: ${{ steps.version.outputs.exe_name }}
        if: env.SIGNING_KEY != ''
        shell: bash
        run: |
          EXE="build/${EXE_NAME}"
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "${SIGNING_KEY}" > "$KEY_FILE"
          node -e "
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const key = crypto.createPrivateKey(fs.readFileSync(process.argv[1], 'utf8'));
          const signer = crypto.createSign('sha3-512');
          signer.update(fs.readFileSync(process.argv[2]));
          signer.end();
          const sig = signer.sign({ key, dsaEncoding: 'der' });
          fs.writeFileSync(process.argv[2] + '.sig', sig);
          console.log('Wrote ' + process.argv[2] + '.sig (' + sig.length + ' bytes, SHA3-512, DER)');
          " "$KEY_FILE" "$EXE"

      # ---- Upload artifacts for release job ----

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/${{ steps.version.outputs.exe_name }}
            build/${{ steps.version.outputs.exe_name }}.sha256
            build/${{ steps.version.outputs.exe_name }}.sha3-512
            build/${{ steps.version.outputs.exe_name }}.sig
            build/${{ steps.version.outputs.exe_name }}.asc
            build/${{ steps.version.outputs.exe_name }}.sha256.asc
            build/${{ steps.version.outputs.exe_name }}.sha3-512.asc
          if-no-files-found: ignore

  prepare-release:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # OIDC token for cosign sign-blob
    outputs:
      version: ${{ steps.version.outputs.version }}
      hashes:  ${{ steps.subjects.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning] no cache input set, so setup-node caches nothing.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('./lib/constants').VERSION)")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Release-notes gate (release-notes/v$VERSION.json must exist + match CHANGELOG.md)
        shell: bash
        run: node scripts/check-changelog-extract.js

      - name: Download all matrix artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Build CycloneDX 1.6 SBOM
        shell: bash
        env:
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
        run: |
          node scripts/build-sbom.js --out artifacts
          ls -l "artifacts/hermitstash-sync-v${VERSION_OUTPUT}.cdx.json"

      - name: Build CSAF 2.1 VEX document (when vex/statements.json has entries)
        shell: bash
        env:
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
        run: |
          node scripts/build-vex.js --out artifacts
          if [ -f "artifacts/hermitstash-sync-v${VERSION_OUTPUT}.vex.json" ]; then
            echo "VEX document attached."
          else
            echo "No VEX statements pending — skipping VEX attachment."
          fi

      # ---- ML-DSA-65 PQC sidecar over each platform binary ----
      # Independent of the in-binary auto-update ECDSA signature
      # (which the daemon verifies via node:crypto). The .mldsa.sig
      # is an additive sidecar for operators with a PQC-only
      # verification posture; verify via scripts/verify-release.js
      # --mldsa.
      #
      # Conditional on the operator having completed the one-time
      # release-key setup (`node scripts/generate-release-signing-key.js`,
      # commit `keys/release-pqc-pub.json`, set
      # `RELEASE_PQC_SIGNING_KEY` secret). When either piece is
      # missing the step logs a warning and the release still ships
      # the binary + SHA-256 + SHA3-512 + GPG + ECDSA + SBOM + cosign
      # bundle + SLSA L3 attestation; the .mldsa.sig sidecar lights
      # up on the FIRST release after setup completes.
      - name: ML-DSA-65 sign each platform binary
        id: pqc-sig
        env:
          RELEASE_PQC_SIGNING_KEY: ${{ secrets.RELEASE_PQC_SIGNING_KEY }}
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_PQC_SIGNING_KEY:-}" ]; then
            echo "::warning::RELEASE_PQC_SIGNING_KEY secret is empty — skipping the PQC sidecar."
            echo "::warning::Operator: run 'node scripts/generate-release-signing-key.js' once, commit keys/release-pqc-pub.json, set the secret, then future releases pick up the sig automatically."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f keys/release-pqc-pub.json ]; then
            echo "::warning::keys/release-pqc-pub.json missing — skipping the PQC sidecar."
            echo "::warning::The secret is set but the matching public key is not committed; the signer self-verify would refuse the sig anyway."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shopt -s nullglob
          BINS=(artifacts/hermitstash-sync-v${VERSION_OUTPUT}-*)
          # Filter out sidecars (.sha256, .sha3-512, .sig, .asc, .mldsa.sig, etc.)
          PLAIN_BINS=()
          for f in "${BINS[@]}"; do
            case "$f" in
              *.sha256|*.sha3-512|*.sig|*.asc|*.mldsa.sig|*.sigstore|*.intoto.jsonl|*.cdx.json|*.vex.json) ;;
              *) PLAIN_BINS+=("$f") ;;
            esac
          done
          if [ ${#PLAIN_BINS[@]} -eq 0 ]; then
            echo "::error::no platform binaries found to sign"
            exit 1
          fi
          for bin in "${PLAIN_BINS[@]}"; do
            node scripts/sign-release-artifact.js "$bin"
          done
          echo "available=true" >> "$GITHUB_OUTPUT"

      # ---- Cosign sign-blob (Sigstore-keyless) of SBOM + VEX ----
      # The workflow's OIDC token is exchanged with Sigstore Fulcio
      # for a short-lived cert bound to the workflow identity, then
      # cosign signs the SBOM/VEX bytes. Verifiers reach for the
      # Rekor transparency-log entry. The .sigstore bundle file
      # carries the signature + cert + log inclusion proof; no
      # long-lived key material lives in this repo.

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Cosign sign-blob SBOM + VEX
        shell: bash
        env:
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_OUTPUT}"
          SBOM="artifacts/hermitstash-sync-v${VERSION}.cdx.json"
          VEX="artifacts/hermitstash-sync-v${VERSION}.vex.json"
          if [ -f "$SBOM" ]; then
            cosign sign-blob --yes --bundle "${SBOM}.sigstore" "$SBOM"
            echo "[cosign] signed $SBOM"
          fi
          if [ -f "$VEX" ]; then
            cosign sign-blob --yes --bundle "${VEX}.sigstore" "$VEX"
            echo "[cosign] signed $VEX"
          fi

      # ---- Compute SLSA subjects ----
      # SLSA "subjects" = the artifacts the attestation describes.
      # Subjects span the platform binaries + SBOM + VEX (when
      # present). The .sigstore bundles + .sha256/.sha3-512/.asc
      # sidecars are NOT subjects — they're signatures/digests OVER
      # the subjects.
      - name: Compute SLSA subjects (base64-encoded sha256 manifest)
        id: subjects
        shell: bash
        env:
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_OUTPUT}"
          shopt -s nullglob
          BINS=(artifacts/hermitstash-sync-v${VERSION}-*)
          # Drop sidecars from the subject list.
          PLAIN_BINS=()
          for f in "${BINS[@]}"; do
            case "$f" in
              *.sha256|*.sha3-512|*.sig|*.asc|*.mldsa.sig|*.sigstore|*.intoto.jsonl) ;;
              *) PLAIN_BINS+=("$f") ;;
            esac
          done
          SBOM="artifacts/hermitstash-sync-v${VERSION}.cdx.json"
          VEX="artifacts/hermitstash-sync-v${VERSION}.vex.json"
          # `subjects.txt` is a scratch manifest consumed by the
          # provenance job's `base64-subjects` input. It lives at the
          # workflow root (NOT inside `artifacts/`) so the publish
          # job's `gh release create files: artifacts/*` glob does
          # not attach it as a release asset — the SLSA attestation
          # itself (`.intoto.jsonl`) carries the same information
          # signed, so the plaintext copy on the release page is
          # redundant. v0.8.24 shipped it by mistake; from v0.8.25
          # forward the release page stays clean.
          {
            for bin in "${PLAIN_BINS[@]}"; do
              (cd artifacts && sha256sum "$(basename "$bin")")
            done
            (cd artifacts && sha256sum "$(basename "$SBOM")")
            if [ -f "$VEX" ]; then
              (cd artifacts && sha256sum "$(basename "$VEX")")
            fi
          } > subjects.txt
          echo "[slsa-subjects] manifest:"
          cat subjects.txt
          HASHES_B64=$(base64 -w0 < subjects.txt)
          echo "hashes=$HASHES_B64" >> "$GITHUB_OUTPUT"

      - name: Build GitHub-release-page markdown from release-notes JSON
        shell: bash
        env:
          VERSION_OUTPUT: ${{ steps.version.outputs.version }}
        run: |
          node scripts/generate-changelog-entry.js --release-page > release-notes.md
          BYTES=$(wc -c < release-notes.md | tr -d ' ')
          if [ "$BYTES" -lt 64 ]; then
            echo "::error::generate-changelog-entry produced an unexpectedly small release-page markdown ($BYTES bytes)."
            echo "::error::Inspect release-notes/v${VERSION_OUTPUT}.json — every section may have rendered empty."
            exit 1
          fi
          echo "[release-notes] rendered $BYTES bytes for v${VERSION_OUTPUT}"
          head -20 release-notes.md

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            artifacts/**
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  # SLSA L3 provenance attestation across the platform binaries +
  # SBOM + VEX. The reusable workflow produces a `.intoto.jsonl`
  # signed via Sigstore-keyless. `upload-assets: false` so the file
  # comes back as a workflow artifact for atomic attach in `publish`
  # — the GH release does not exist yet at this point.
  provenance:
    needs: prepare-release
    if: ${{ !inputs.dry_run }}
    permissions:
      id-token: write    # OIDC token for Sigstore-keyless signing
      # contents:write is REQUIRED even with upload-assets:false: the SLSA
      # reusable workflow (generator_generic_slsa3.yml) declares contents:write
      # in its own top-level permissions block, and GitHub rejects a caller that
      # grants less than a called reusable workflow declares — a caller with
      # contents:read fails the whole run at startup (startup_failure), not just
      # the provenance job. The `publish` job still owns the release-create write.
      contents: write
      actions: read      # introspect this workflow run for the attestation
    # IMPORTANT: Tag-pinned, NOT SHA-pinned. SLSA's internal builder-
    # fetch step expects `BUILDER_REF` in `refs/tags/vX.Y.Z` form and
    # refuses a 40-hex SHA. This is one of two intentional exceptions
    # to this repo's "SHA-pin artifact-producing actions" posture
    # (the other is the cosign-installer above, which is SHA-pinned;
    # only this reusable workflow needs the tag form).
    # Tag-pinned by SLSA constraint (see the note above) — the builder-fetch refuses a 40-hex SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects:    "${{ needs.prepare-release.outputs.hashes }}"
      upload-assets:      false
      provenance-name:    "hermitstash-sync-v${{ needs.prepare-release.outputs.version }}.intoto.jsonl"
      # SLSA's privacy detection sometimes reports public repos as
      # private (it walks workflow permissions rather than repo
      # visibility) and halts to avoid leaking the repo name in
      # Sigstore's public transparency log. github.com/dotCooCoo/hermitstash-sync
      # is public; the transparency-log entry is the desired
      # behavior.
      private-repository: true
      # The SLSA workflow's `final` job ANDs every nested job's
      # outcome — including `upload-assets`, which is skipped here.
      # `continue-on-error: true` keeps the workflow reporting
      # success on the skipped path; a real missing-attestation
      # failure still surfaces at the `publish` job's download-
      # artifact step.
      continue-on-error: true

  publish:
    needs: [prepare-release, provenance]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write    # gh release create + asset attach
    timeout-minutes: 15
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle

      - name: Download SLSA provenance attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hermitstash-sync-v${{ needs.prepare-release.outputs.version }}.intoto.jsonl

      - name: Move provenance into artifacts/
        shell: bash
        env:
          PREPARE_RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          INTOTO="hermitstash-sync-v${PREPARE_RELEASE_VERSION}.intoto.jsonl"
          if [ -f "$INTOTO" ]; then
            mv "$INTOTO" artifacts/
          fi
          ls -l artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 # zizmor: ignore[superfluous-actions] deliberate: atomic multi-asset gh release create with provenance attach
        with:
          body_path: release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: false
